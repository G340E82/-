
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOON Admin</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0912;
      --panel: #15111f;
      --border: #30243f;
      --purple: #a855f7;
      --text: #f4efff;
      --muted: #aaa0bd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(1100px, 92%);
      margin: 35px auto;
    }

    h1 { margin-bottom: 8px; }
    .muted { color: var(--muted); }

    .panel, .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin: 16px 0;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f0b18;
      color: var(--text);
      font-size: 15px;
    }

    button {
      cursor: pointer;
      background: var(--purple);
      border-color: var(--purple);
      color: white;
      font-weight: bold;
    }

    button.secondary { background: #251a35; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid #d8b4fe;
      outline-offset: 2px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 22px 0;
    }

    nav button {
      width: auto;
      flex: 1 1 150px;
    }

    section[hidden] { display: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
    }

    .card strong {
      display: block;
      font-size: 25px;
      margin-top: 12px;
    }

    #status {
      min-height: 24px;
      overflow-wrap: anywhere;
    }

    .notice {
      padding: 12px;
      border-left: 3px solid var(--purple);
      background: #1b1427;
      border-radius: 5px;
    }
